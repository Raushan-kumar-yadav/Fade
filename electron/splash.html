<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fade</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --purple: #7c6fff;
    --violet: #b06ffe;
    --bg:     #08080c;
    --glass:  rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.07);
    --text:   #ffffff;
    --muted:  rgba(255,255,255,0.28);
  }

  html {
    background: transparent;
  }
  body {
    width: 100vw; height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
    border-radius: 16px;
    border: 1px solid var(--border);
  }

  /* ── Ambient glow behind everything ── */
  .glow-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 30% 60%, rgba(124,111,255,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 50% 35% at 75% 35%, rgba(176,111,254,0.09) 0%, transparent 65%);
  }

  /* ── Card ── */
  .card {
    position: relative;
    z-index: 1;
    width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ── Logo mark ── */
  .logo {
    width: 72px; height: 72px;
    border-radius: 24px;
    background: linear-gradient(145deg, #7c6fff 0%, #b06ffe 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.12),
      0 8px 32px rgba(124,111,255,0.5),
      0 2px 8px rgba(0,0,0,0.6);
    animation: logoFloat 3s ease-in-out infinite;
    margin-bottom: 28px;
  }

  @keyframes logoFloat {
    0%, 100% { transform: translateY(0px);   box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 8px 32px rgba(124,111,255,0.5), 0 2px 8px rgba(0,0,0,0.6); }
    50%       { transform: translateY(-5px);  box-shadow: 0 0 0 1px rgba(255,255,255,0.15), 0 16px 48px rgba(124,111,255,0.65), 0 4px 12px rgba(0,0,0,0.7); }
  }

  /* F letterform SVG */
  .logo svg { width: 36px; height: 36px; }

  /* ── Typography ── */
  .app-name {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
    background: linear-gradient(160deg, #ffffff 0%, rgba(255,255,255,0.6) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 48px;
  }



  /* ── Status line ── */
  .status-text {
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.02em;
    min-height: 18px;
    margin-bottom: 12px;
    transition: opacity 0.3s;
    text-align: center;
  }
  .status-text.ok   { color: #34d399; }
  .status-text.err  { color: #f87171; }
  .status-text.warn { color: #fbbf24; }

  /* ── Progress bar ── */
  .bar-wrap {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 32px;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--purple), var(--violet));
    border-radius: 99px;
    transition: width 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 12px rgba(124,111,255,0.7);
  }

  /* ── Dot spinner ── */
  .dots {
    display: flex;
    gap: 6px;
    align-items: center;
    transition: opacity 0.4s;
  }
  .dots span {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(124,111,255,0.6);
    animation: dotPulse 1.4s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotPulse {
    0%, 80%, 100% { transform: scale(0.5); opacity: 0.3; }
    40%           { transform: scale(1.1); opacity: 1; }
  }

  /* ── Version chip ── */
  .version {
    position: fixed;
    bottom: 18px;
    right: 20px;
    font-size: 10px;
    font-weight: 600;
    color: rgba(255,255,255,0.12);
    letter-spacing: 0.06em;
  }

  /* ── Fade-out ── */
  body.fade-out {
    animation: bodyFadeOut 0.4s ease forwards;
  }
  @keyframes bodyFadeOut { to { opacity: 0; } }
</style>
</head>
<body>

<div class="glow-bg"></div>

<div class="card">

  <!-- Logo: stylised "F" on gradient rounded square -->
  <div class="logo">
    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Bold "F" letterform -->
      <rect x="9" y="8" width="5" height="20" rx="2.5" fill="white"/>
      <rect x="9" y="8" width="17" height="5" rx="2.5" fill="white"/>
      <rect x="9" y="17" width="13" height="4.5" rx="2.25" fill="rgba(255,255,255,0.65)"/>
    </svg>
  </div>

  <div class="app-name">Fade</div>
  
  <div class="status-text" id="statusText">Starting up…</div>

  <div class="bar-wrap">
    <div class="bar-fill" id="bar"></div>
  </div>

  <div class="dots" id="dots">
    <span></span><span></span><span></span>
  </div>

</div>

<div class="version" id="ver">v1.0</div>

<script>
  const bar        = document.getElementById('bar');
  const statusEl   = document.getElementById('statusText');
  const dots       = document.getElementById('dots');
  let   curProgress = 0;

  function setStatus(text, cls) {
    statusEl.className = 'status-text' + (cls ? ' ' + cls : '');
    statusEl.textContent = text;
  }

  function setProgress(pct) {
    curProgress = Math.max(curProgress, Math.min(100, pct));
    bar.style.width = curProgress + '%';
  }

  function onDone() {
    setProgress(100);
    setStatus('Ready', 'ok');
    dots.style.opacity = '0';
    setTimeout(() => document.body.classList.add('fade-out'), 400);
  }

  // Electron IPC
  if (window.electronAPI && window.electronAPI.onSplashStatus) {
    window.electronAPI.onSplashStatus((msg) => {
      setStatus(msg.text, msg.cls);
      if (msg.progress !== undefined) setProgress(msg.progress);
      if (msg.done) onDone();
    });
  }

  // postMessage fallback
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'splash:status') {
      setStatus(e.data.text, e.data.cls);
      if (e.data.progress !== undefined) setProgress(e.data.progress);
    }
    if (e.data.type === 'splash:done') onDone();
  });

  // Boot
  setProgress(5);
</script>
</body>
</html>
